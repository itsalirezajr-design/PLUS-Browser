name: PLUS Browser APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Generate new PLUS signing key
        run: |
          mkdir -p signing
          keytool -genkeypair -v \
            -keystore signing/plus-debug.keystore \
            -storepass android \
            -alias plusdebug \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=PLUS Browser, OU=PLUS, O=PLUS, L=Amsterdam, ST=North Holland, C=NL"

      - name: Run unit tests
        run: bash ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Build APK
        run: bash ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PLUS-Browser-v1.1-Speed-Dial
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
