name: PLUS Browser APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore PLUS signing key
        env:
          PLUS_DEBUG_KEYSTORE_BASE64: ${{ secrets.PLUS_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$PLUS_DEBUG_KEYSTORE_BASE64" ]; then
            echo "Missing repository secret PLUS_DEBUG_KEYSTORE_BASE64. Add the existing plus-debug.keystore as a base64 GitHub Actions secret to preserve upgrade compatibility."
            exit 1
          fi
          mkdir -p signing
          echo "$PLUS_DEBUG_KEYSTORE_BASE64" | base64 --decode > signing/plus-debug.keystore
          test -s signing/plus-debug.keystore

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PLUS-Browser-v1.1-Speed-Dial
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
